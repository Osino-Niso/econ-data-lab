name: Render BOJ oil-shock comparison draft

on:
  push:
    branches:
      - draft/boj-oil-us-japan-data-figure-20261026
    paths:
      - "code/oil-shocks-inflation-regimes/jp_us_headline_1970_1983.csv"
      - "code/oil-shocks-inflation-regimes/plot_jp_us.py"
      - ".github/workflows/render-boj-oil-draft.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Japanese plotting font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install chart dependencies
        run: python -m pip install matplotlib pillow
      - name: Reproduce Japan/US CPI chart
        run: python code/oil-shocks-inflation-regimes/plot_jp_us.py
      - name: Commit chart to draft branch (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/boj-oil-us-japan-cpi-1970-1983.webp
          if ! git diff --cached --quiet; then
            git commit -m "Render verified World Bank inflation chart"
            git push
          fi
