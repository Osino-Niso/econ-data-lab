name: Validate article code

on:
  pull_request:
    paths:
      - "code/**"
      - "articles/**"
      - ".github/workflows/validate-code.yml"
  push:
    branches:
      - main
    paths:
      - "code/**"
      - "articles/**"
      - ".github/workflows/validate-code.yml"
  workflow_dispatch:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy

      - name: Run Bernoulli example
        run: |
          mkdir -p ci-output
          python code/bernoulli-one-trial/python.py | tee ci-output/python.txt

      - name: Save Python output
        uses: actions/upload-artifact@v4
        with:
          name: bernoulli-python-output
          path: ci-output/python.txt

  r:
    name: R
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run Bernoulli example
        run: |
          mkdir -p ci-output
          Rscript code/bernoulli-one-trial/r.R | tee ci-output/r.txt

      - name: Save R output
        uses: actions/upload-artifact@v4
        with:
          name: bernoulli-r-output
          path: ci-output/r.txt
