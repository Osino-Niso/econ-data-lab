name: Validate article code

on:
  pull_request:
    paths:
      - "code/**"
      - "articles/**"
      - "images/**"
      - ".github/workflows/validate-code.yml"
  push:
    branches:
      - main
    paths:
      - "code/**"
      - "articles/**"
      - "images/**"
      - ".github/workflows/validate-code.yml"
  workflow_dispatch:

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip numpy matplotlib

      - name: Run Bernoulli example
        run: |
          mkdir -p ci-output
          python code/bernoulli-one-trial/python.py | tee ci-output/python.txt

      - name: Run zero conditional mean example
        run: |
          python code/zero-conditional-mean/python.py | tee ci-output/zero-conditional-mean-python.txt

      - name: Run sampling distribution moments example
        run: |
          python code/sampling-distribution-moments/python.py | tee ci-output/sampling-distribution-moments-python.txt

      - name: Run QoQ vs YoY IIP example
        run: |
          python code/qoq-vs-yoy-iip/python.py | tee ci-output/qoq-vs-yoy-iip-python.txt

      - name: Run present value cash flow example
        run: |
          python code/present-value-cash-flows/python.py | tee ci-output/present-value-cash-flows-python.txt

      - name: Save Python output
        uses: actions/upload-artifact@v4
        with:
          name: bernoulli-python-output
          path: ci-output/python.txt

      - name: Save zero conditional mean Python output
        uses: actions/upload-artifact@v4
        with:
          name: zero-conditional-mean-python-output
          path: ci-output/zero-conditional-mean-python.txt

      - name: Save sampling distribution moments Python output
        uses: actions/upload-artifact@v4
        with:
          name: sampling-distribution-moments-python-output
          path: ci-output/sampling-distribution-moments-python.txt

      - name: Save QoQ vs YoY Python output
        uses: actions/upload-artifact@v4
        with:
          name: qoq-vs-yoy-iip-python-output
          path: ci-output/qoq-vs-yoy-iip-python.txt

      - name: Save present value cash flow Python output
        uses: actions/upload-artifact@v4
        with:
          name: present-value-cash-flows-python-output
          path: ci-output/present-value-cash-flows-python.txt

      - name: Save sampling distribution plot
        uses: actions/upload-artifact@v4
        with:
          name: sampling-distribution-moments-python-plot
          path: images/sampling-distribution-moments.webp

      - name: Save QoQ vs YoY plot
        uses: actions/upload-artifact@v4
        with:
          name: qoq-vs-yoy-iip-python-plot
          path: images/qoq-vs-yoy-iip.webp

  r:
    name: R
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Run Bernoulli example
        run: |
          mkdir -p ci-output
          Rscript code/bernoulli-one-trial/r.R | tee ci-output/r.txt

      - name: Run zero conditional mean example
        run: |
          Rscript code/zero-conditional-mean/r.R | tee ci-output/zero-conditional-mean-r.txt

      - name: Run sampling distribution moments example
        run: |
          Rscript code/sampling-distribution-moments/r.R | tee ci-output/sampling-distribution-moments-r.txt

      - name: Run QoQ vs YoY IIP example
        run: |
          Rscript code/qoq-vs-yoy-iip/r.R | tee ci-output/qoq-vs-yoy-iip-r.txt

      - name: Run present value cash flow example
        run: |
          Rscript code/present-value-cash-flows/r.R | tee ci-output/present-value-cash-flows-r.txt

      - name: Save R output
        uses: actions/upload-artifact@v4
        with:
          name: bernoulli-r-output
          path: ci-output/r.txt

      - name: Save zero conditional mean R output
        uses: actions/upload-artifact@v4
        with:
          name: zero-conditional-mean-r-output
          path: ci-output/zero-conditional-mean-r.txt

      - name: Save sampling distribution moments R output
        uses: actions/upload-artifact@v4
        with:
          name: sampling-distribution-moments-r-output
          path: ci-output/sampling-distribution-moments-r.txt

      - name: Save QoQ vs YoY R output
        uses: actions/upload-artifact@v4
        with:
          name: qoq-vs-yoy-iip-r-output
          path: ci-output/qoq-vs-yoy-iip-r.txt

      - name: Save present value cash flow R output
        uses: actions/upload-artifact@v4
        with:
          name: present-value-cash-flows-r-output
          path: ci-output/present-value-cash-flows-r.txt
