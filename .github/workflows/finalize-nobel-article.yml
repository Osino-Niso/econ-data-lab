name: Finalize Nobel article draft

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/finalize-nobel-article.yml"

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: draft/nobel-2026-pricing-inflation

      - name: Update article text
        run: python .github/scripts/finalize_nobel_article.py

      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/nobel-2026-pricing-inflation.md
          git diff --cached --quiet && exit 0
          git commit -m "Polish interactive lab section in Nobel article"
          git push origin HEAD:draft/nobel-2026-pricing-inflation
