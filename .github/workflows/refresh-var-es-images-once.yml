name: Refresh VaR-ES chart PNGs (temporary)
on:
  push:
    branches:
      - draft/var-es-positive-expected-return-20261022
    paths:
      - .github/workflows/refresh-var-es-images-once.yml
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib
      - name: Regenerate article images
        run: python code/var-es-risk-ranking/figures.py
      - name: Commit refreshed images to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/var-es-risk-ranking-distributions.png images/var-es-risk-ranking-tail.png
          if git diff --cached --quiet; then
            echo "Images unchanged"
          else
            git commit -m "Refresh VaR ES figures for positive-return example"
            git push origin HEAD:refs/heads/draft/var-es-positive-expected-return-20261022
          fi
