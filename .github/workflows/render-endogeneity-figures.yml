name: Render endogeneity article figures

on:
  push:
    branches: [main]
    paths:
      - "code/endogeneity-sample-size/figures.py"
      - ".github/workflows/render-endogeneity-figures.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-endogeneity-main
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Install plotting dependencies
        run: python -m pip install numpy matplotlib pillow
      - name: Generate and validate figures
        run: |
          python code/endogeneity-sample-size/figures.py
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ("distributions","structure"):
              p = Path("images") / f"endogeneity-sample-size-{name}.webp"
              assert p.exists() and p.stat().st_size < 3000000, p
              with Image.open(p) as im:
                  assert im.format == "WEBP" and im.width >= 1200 and im.height >= 1200
                  im.verify()
              print("verified", p, p.stat().st_size)
          PY
      - name: Commit generated images to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/endogeneity-sample-size-distributions.webp images/endogeneity-sample-size-structure.webp
          if ! git diff --cached --quiet; then
            git commit -m "Render endogeneity article diagrams [skip ci]"
            git push origin HEAD:main
          else
            echo "Generated images are up to date."
          fi
