name: One-off publish Nobel article 7

on:
  push:
    branches:
      - publish/nobel-2026-pricing-inflation
    paths:
      - ".github/workflows/oneoff-publish-nobel-7.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/nobel-2026-pricing-inflation

      - name: Set published true
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('articles/nobel-2026-pricing-inflation.md')
          text = path.read_text(encoding='utf-8')
          old = 'published: false'
          if old not in text:
              raise SystemExit('published: false not found')
          text = text.replace(old, 'published: true', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/oneoff-publish-nobel-7.yml

      - name: Commit publication switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles/nobel-2026-pricing-inflation.md .github/workflows/oneoff-publish-nobel-7.yml
          git commit -m "Publish Nobel 2026 pricing-inflation article"
          git push origin HEAD:publish/nobel-2026-pricing-inflation
